<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gizmo Test Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }

        .result {
            background: #f7f7f7;
            padding: 1em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        select,
        button {
            margin-bottom: 1em;
            display: block;
            width: 100%;
            max-width: 500px;
        }

        textarea {
            min-height: 80px;
        }
    </style>
</head>

<body>
    <h2>Create a Paste</h2>
    <form id="pasteForm">
        <label for="title">Title</label>
        <input type="text" id="title" name="title">
        <label for="content">Content</label>
        <textarea id="content" name="content" required></textarea>
        <label for="exposure">Exposure</label>
        <select id="exposure" name="exposure">
            <option value="PUBLIC">Public</option>
            <option value="PRIVATE">Private</option>
        </select>
        <label for="date_of_expiry">Expiry Date (optional)</label>
        <input type="datetime-local" id="date_of_expiry" name="date_of_expiry">
        <button type="submit">Create Paste</button>
    </form>
    <div id="createResult"></div>

    <hr>
    <h2>All Public Pastes</h2>
    <button id="loadAllBtn">Load All</button>
    <div id="allPastes"></div>

    <hr>
    <h2>Fetch Paste by ID</h2>
    <input type="text" id="fetchId" placeholder="Paste ID">
    <button id="fetchBtn">Fetch</button>
    <div id="fetchResult"></div>

    <script>
        const API_BASE = 'http://localhost:3000/paste';

        document.getElementById('pasteForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                title: e.target.title.value,
                content: e.target.content.value,
                exposure: e.target.exposure.value,
            };
            if (e.target.date_of_expiry.value) data.date_of_expiry = e.target.date_of_expiry.value;
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();
            document.getElementById('createResult').innerHTML = `<div class="result"><pre>${JSON.stringify(json, null, 2)}</pre></div>`;
        };

        document.getElementById('loadAllBtn').onclick = async () => {
            const res = await fetch(API_BASE);
            const json = await res.json();
            document.getElementById('allPastes').innerHTML =
                json.pastes && json.pastes.length ? json.pastes.map(p =>
                    `<div class="result"><b>${p.title || "No Title"}</b><br>${p.content}<br><small>ID: ${p.id}</small></div>`
                ).join('') : "<div>No pastes found.</div>";
        };

        document.getElementById('fetchBtn').onclick = async () => {
            const id = document.getElementById('fetchId').value.trim();
            if (!id) return document.getElementById('fetchResult').innerHTML = "Paste ID required.";
            const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}`);
            const json = await res.json();
            if (json.error) {
                document.getElementById('fetchResult').innerHTML = `<div class="result">ERROR: ${json.error}</div>`;
            } else {
                document.getElementById('fetchResult').innerHTML = `<div class="result"><pre>${JSON.stringify(json, null, 2)}</pre></div>`;
            }
        };
    </script>
</body>

</html>
